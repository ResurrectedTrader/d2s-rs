name: Publish to crates.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}

permissions:
  contents: write
  id-token: write  # required for crates.io trusted publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version calculation

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            # First release: publish the version declared in Cargo.toml as-is
            NEW_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "First release: $NEW_VERSION"
            exit 0
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"

          BUMP_TYPE="${{ inputs.version_bump }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Set crate version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          cargo update --workspace
          grep -m1 '^version' Cargo.toml

      - name: Package
        run: cargo package --allow-dirty

      # Trusted publishing can only be configured once the crate exists on crates.io, so the
      # very first release needs a CARGO_REGISTRY_TOKEN repository secret. When the secret is
      # absent, a short-lived token is requested via OIDC (requested immediately before use).
      - name: crates.io login (OIDC -> short-lived token)
        if: ${{ env.HAS_REGISTRY_TOKEN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            target/package/*.crate
